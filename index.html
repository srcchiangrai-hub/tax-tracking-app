<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 Dashboard รายงานติดตามภาษี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive, sans-serif; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; p: 0; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Navigation Bar -->
    <div class="no-print bg-white rounded-3xl shadow-md border-2 border-purple-100 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="bg-purple-100 text-purple-700 px-4 py-1.5 rounded-full text-xs font-bold">👑 Executive Portal</span>
        <h1 class="text-2xl font-bold text-slate-800 mt-2">รายงานข้อมูลการติดตามภาษี</h1>
      </div>
      <div class="flex gap-3">
        <a href="admin.html" class="bg-pink-500 hover:bg-pink-600 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition shadow-md flex items-center gap-2">
          ✏️ หน้าเจ้าหน้าที่ (บันทึกข้อมูล)
        </a>
        <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition shadow-md flex items-center gap-2">
          🖨️ พิมพ์รายงาน A4
        </button>
      </div>
    </div>

    <!-- ตารางสรุปข้อมูล -->
    <div class="bg-white rounded-3xl shadow-md border-2 border-purple-100 p-6 overflow-x-auto">
      <h2 class="text-lg font-bold text-slate-700 mb-4">รายการบันทึกทั้งหมด</h2>
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-purple-50 text-purple-900 border-b-2 border-purple-200">
            <th class="p-3">วันที่/เวลา</th>
            <th class="p-3">ชื่อ-นามสกุล</th>
            <th class="p-3">ประเภทภาษี</th>
            <th class="p-3">ยอดค้าง (บาท)</th>
            <th class="p-3">ผลการติดตาม</th>
            <th class="p-3">รูปถ่าย</th>
            <th class="p-3">ผู้บันทึก</th>
          </tr>
        </thead>
        <tbody id="dataTable" class="divide-y divide-slate-100">
          <tr>
            <td colspan="7" class="text-center p-6 text-slate-400">⏳ กำลังโหลดข้อมูล...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 ใส่ Firebase Config จริงของคุณที่นี่
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ดึงข้อมูล Realtime
    const q = query(collection(db, "tax_records"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById("dataTable");
      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-slate-400">ยังไม่มีข้อมูลในระบบ</td></tr>`;
        return;
      }

      let html = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const dateStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('th-TH') : '-';
        
        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 text-xs text-slate-500">${dateStr}</td>
            <td class="p-3 font-bold text-slate-700">${data.fullName || '-'}</td>
            <td class="p-3">${data.taxType || '-'}</td>
            <td class="p-3 font-semibold text-pink-600">${(data.taxAmount || 0).toLocaleString()}</td>
            <td class="p-3"><span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">${data.followResult || '-'}</span></td>
            <td class="p-3">
              ${data.photoUrl ? `<a href="${data.photoUrl}" target="_blank" class="text-xs text-purple-600 underline font-bold">🖼️ ดูรูปภาพ</a>` : '<span class="text-slate-300">-</span>'}
            </td>
            <td class="p-3 text-xs text-slate-500">${data.reporterName || '-'}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    });
  </script>
</body>
</html>
