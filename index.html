<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 Dashboard รายงานติดตามภาษี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: 'Mali', cursive, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header / Navigation -->
    <div class="no-print bg-white rounded-3xl shadow-md border-2 border-purple-100 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="bg-purple-100 text-purple-700 px-4 py-1.5 rounded-full text-xs font-bold">👑 Executive Portal</span>
        <h1 class="text-2xl font-bold text-slate-800 mt-2">รายงานข้อมูลการติดตามภาษี</h1>
      </div>
      <div class="flex gap-3">
        <a href="admin.html" class="bg-pink-500 hover:bg-pink-600 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition shadow-md flex items-center gap-2">
          ✏️ หน้าเจ้าหน้าที่ (บันทึกข้อมูล)
        </a>
        <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition shadow-md flex items-center gap-2">
          🖨️ พิมพ์รายงาน A4
        </button>
      </div>
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <div class="bg-white rounded-3xl shadow-md border-2 border-purple-100 p-6 overflow-x-auto">
      <h2 class="text-lg font-bold text-slate-700 mb-4">รายการบันทึกทั้งหมด</h2>
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-purple-50 text-purple-900 border-b-2 border-purple-200">
            <th class="p-3">วันที่/เวลา</th>
            <th class="p-3">ชื่อ-นามสกุล</th>
            <th class="p-3">ประเภทภาษี</th>
            <th class="p-3">ยอดค้าง (บาท)</th>
            <th class="p-3">ผลการติดตาม</th>
            <th class="p-3">รูปถ่าย</th>
            <th class="p-3">ผู้บันทึก</th>
          </tr>
        </thead>
        <tbody id="dataTable" class="divide-y divide-slate-100">
          <tr>
            <td colspan="7" class="text-center p-6 text-slate-400">⏳ กำลังโหลดข้อมูล...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
