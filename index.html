<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard รายงานภาษี</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .card-stat { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.06); }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary">📊 Dashboard รายงานการชำระภาษี</h2>
            <a href="admin.html" class="btn btn-primary">➕ บันทึกข้อมูลใหม่</a>
        </div>

        <!-- การ์ดสรุปยอดเงิน -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card card-stat bg-primary text-white p-3">
                    <h5 class="opacity-75">ยอดรวมภาษีทั้งหมด</h5>
                    <h2 id="totalAmount" class="fw-bold mb-0">0.00 บาท</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-stat bg-success text-white p-3">
                    <h5 class="opacity-75">จำนวนรายการทั้งหมด</h5>
                    <h2 id="totalCount" class="fw-bold mb-0">0 รายการ</h2>
                </div>
            </div>
        </div>

        <!-- เครื่องมือค้นหาและเรียงลำดับ -->
        <div class="card p-4">
            <div class="row g-2 mb-3">
                <div class="col-md-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาตามชื่อผู้บันทึก หรือประเภทภาษี...">
                </div>
                <div class="col-md-4">
                    <select id="sortSelect" class="form-select">
                        <option value="desc">📅 ใหม่ล่าสุด</option>
                        <option value="asc">📅 เก่าที่สุด</option>
                        <option value="name_asc">🔤 จัดเรียงชื่อ ก-ฮ</option>
                        <option value="name_desc">🔤 จัดเรียงชื่อ ฮ-ก</option>
                    </select>
                </div>
            </div>

            <!-- ตารางแสดงข้อมูล -->
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>วันที่/เวลา</th>
                            <th>ชื่อผู้บันทึก</th>
                            <th>ประเภทภาษี</th>
                            <th class="text-end">ยอดภาษี (บาท)</th>
                            <th class="text-center">หลักฐาน</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTable">
                        <tr><td colspan="5" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
