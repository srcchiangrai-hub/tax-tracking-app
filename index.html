<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ผู้บริหาร - ระบบติดตามภาษี</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f6f9fc; }
        .navbar-cute { background: linear-gradient(90deg, #fed6e3 0%, #a8edea 100%); }
        .card-cute { border: none; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); background: #ffffff; }
        .card-stat { border-radius: 18px; border: none; color: white; }
        
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light navbar-cute shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-secondary" href="#"><span class="fs-4">📊</span> Dashboard ผู้บริหาร</a>
            <div>
                <a href="admin.html" class="btn btn-sm btn-white rounded-pill px-3 shadow-sm me-2">➕ หน้าคีย์ข้อมูล</a>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger px-3">🚪 ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- Cards สรุปยอด KPIs (ทศนิยม 2 ตำแหน่ง) -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat p-3 shadow-sm" style="background: linear-gradient(45deg, #ff9a9e, #fecfef);">
                    <span class="opacity-75">ยอดภาษีค้างชำระรวม</span>
                    <h2 class="fw-bold mb-0" id="totalAmount">0.00 บาท</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3 shadow-sm" style="background: linear-gradient(45deg, #a8edea, #fed6e3); color: #2d545e;">
                    <span class="opacity-75">จำนวนการออกติดตามทั้งหมด</span>
                    <h2 class="fw-bold mb-0" id="totalCount">0 รายการ</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3 shadow-sm" style="background: linear-gradient(45deg, #a1c4fd, #c2e9fb); color: #1e3c72;">
                    <span class="opacity-75">ติดตามสำเร็จ (พบตัว/ยอมชำระ)</span>
                    <h2 class="fw-bold mb-0" id="successCount">0 รายการ</h2>
                </div>
            </div>
        </div>

        <!-- รายการสรุปและปุ่มพิมพ์ -->
        <div class="card card-cute p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-secondary m-0"><i class="fa-solid fa-table me-2"></i>รายงานข้อมูลการติดตามภาษี</h4>
                <button id="btnPrintDashboard" class="btn btn-primary rounded-pill px-4"><i class="fa-solid fa-print me-2"></i>พิมพ์รายงานสรุปทั้งหมด</button>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาตามชื่อ, เลขประจำตัว, หรือ ตำบล...">
                </div>
                <div class="col-md-4">
                    <select id="sortSelect" class="form-select">
                        <option value="desc">📅 ใหม่ไปเก่า</option>
                        <option value="asc">📅 เก่าไปใหม่</option>
                        <option value="amount_desc">💰 ยอดค้างสูงสุด</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>วัน-เวลา</th>
                            <th>ชื่อผู้เสียภาษี / เลขประจำตัว</th>
                            <th>ประเภทภาษี</th>
                            <th class="text-end">ยอดค้าง (บาท)</th>
                            <th>สถานะการติดตาม</th>
                            <th class="text-center">พิมพ์ / สลิป</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTable">
                        <tr><td colspan="6" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ส่วนที่ใช้สำหรับแสดงผลออกพริ้นเตอร์ -->
    <div id="printableArea" class="p-4" style="display:none;"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
