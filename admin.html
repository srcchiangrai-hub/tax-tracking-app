<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลการเสียภาษี</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); border: none; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary">📝 ระบบบันทึกข้อมูลการชำระภาษี</h2>
            <a href="index.html" class="btn btn-outline-primary">📊 ไปยัง Dashboard</a>
        </div>

        <div class="row g-4">
            <!-- ฟอร์มบันทึกข้อมูล -->
            <div class="col-lg-5">
                <div class="card p-4">
                    <h4 class="card-title mb-3 fw-bold">กรอกข้อมูลภาษี</h4>
                    <form id="taxForm">
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล ผู้บันทึก/ผู้เสียภาษี</label>
                            <input type="text" id="name" class="form-control" required placeholder="นายสมชาย ใจดี">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ประเภทภาษี</label>
                            <select id="taxType" class="form-select" required>
                                <option value="">-- เลือกประเภทภาษี --</option>
                                <option value="ภาษีที่ดินและสิ่งปลูกสร้าง">ภาษีที่ดินและสิ่งปลูกสร้าง</option>
                                <option value="ภาษีป้าย">ภาษีป้าย</option>
                                <option value="ภาษีบำรุงท้องที่">ภาษีบำรุงท้องที่</option>
                                <option value="ภาษีอื่นๆ">ภาษีอื่นๆ</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ยอดภาษี (บาท)</label>
                            <input type="number" id="amount" class="form-control" step="0.01" min="0" required placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">แนบรูปสลิป/หลักฐาน (ส่งเข้า Google Drive)</label>
                            <input type="file" id="imageFile" class="form-control" accept="image/*">
                        </div>
                        <button type="submit" id="btnSubmit" class="btn btn-success w-100 py-2 fw-bold">💾 บันทึกข้อมูลเข้าระบบ</button>
                    </form>
                </div>
            </div>

            <!-- รายการที่บันทึกแล้ว -->
            <div class="col-lg-7">
                <div class="card p-4">
                    <h4 class="card-title mb-3 fw-bold">รายการบันทึกล่าสุด</h4>
                    
                    <!-- เครื่องมือค้นหา และเรียงลำดับ -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-7">
                            <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาตามชื่อผู้บันทึก หรือประเภทภาษี...">
                        </div>
                        <div class="col-md-5">
                            <select id="sortSelect" class="form-select">
                                <option value="desc">📅 ใหม่ล่าสุด</option>
                                <option value="asc">📅 เก่าที่สุด</option>
                                <option value="name_asc">🔤 ชื่อ ก-ฮ</option>
                                <option value="name_desc">🔤 ชื่อ ฮ-ก</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ชื่อผู้บันทึก</th>
                                    <th>ประเภท</th>
                                    <th class="text-end">ยอดเงิน (บาท)</th>
                                    <th class="text-center">สลิป</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                                <tr><td colspan="4" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
