<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลรายได้ - RevenueCute Tracker</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt & Mali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBg: '#FFF9F5',
                        brandPrimary: '#F472B6',
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        cute: ['Mali', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF9F5;
            background-image: radial-gradient(#FDE68A 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }
        .cute-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.1);
            border: 2px solid #FFF0F5;
        }
        .cute-input {
            border-radius: 14px;
            border: 2px solid #F1F5F9;
            transition: all 0.2s ease;
            width: 100%;
            padding: 0.6rem 1rem;
            font-size: 0.875rem;
        }
        .cute-input:focus {
            border-color: #F472B6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.15);
        }
    </style>
</head>
<body class="font-sans text-slate-700 min-h-screen pb-12">

    <!-- 🌸 Header / Navigation Bar (เมนูเต็มครบถ้วน) -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b-2 border-pink-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-pink-100 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
                    📝✨
                </div>
                <div>
                    <h1 class="font-cute font-bold text-xl sm:text-2xl text-pink-500 tracking-wide">
                        RevenueCute Admin
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">ระบบจัดการและบันทึกการเร่งรัดจัดเก็บรายได้</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-2">
                <a href="index.html" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-pink-500 hover:bg-pink-50 transition-all">
                    <i class="fa-solid fa-chart-pie mr-1"></i> แดชบอร์ด
                </a>
                <a href="admin.html" class="px-4 py-2 rounded-xl text-sm font-semibold bg-pink-500 text-white shadow-sm">
                    <i class="fa-solid fa-folder-plus mr-1"></i> จัดการข้อมูล
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- ✍️ FORM SECTION: ฟอร์มบันทึก/แก้ไขข้อมูลแบบละเอียด (5 Cols) -->
        <section class="lg:col-span-5">
            <div class="cute-card p-6 sticky top-28">
                <div class="flex items-center justify-between border-b-2 border-pink-50 pb-3 mb-4">
                    <h3 id="form-title" class="font-cute font-bold text-lg text-slate-800 flex items-center gap-2">
                        <span>✏️</span> บันทึกเคสใหม่
                    </h3>
                    <button id="cancel-edit-btn" onclick="resetForm()" class="text-xs text-rose-500 font-semibold hidden hover:underline">
                        ยกเลิกการแก้ไข
                    </button>
                </div>

                <form id="case-form" class="space-y-3.5 text-xs">
                    <input type="hidden" id="edit-doc-id" value="">

                    <!-- ชื่อผู้เสียภาษี / สถานประกอบการ -->
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">ชื่อผู้เสียภาษี / สถานประกอบการ <span class="text-rose-500">*</span></label>
                        <input type="text" id="taxpayerName" required class="cute-input" placeholder="เช่น บริษัท อบต.น่ารัก จำกัด หรือ นายสมชาย">
                    </div>

                    <!-- เลขประจำตัวภาษี & ปีภาษี -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">เลขประจำตัวภาษี / ID</label>
                            <input type="text" id="taxId" class="cute-input" placeholder="เลขผู้เสียภาษี / แปลงที่ดิน">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ปีภาษี <span class="text-rose-500">*</span></label>
                            <input type="text" id="taxYear" required class="cute-input" placeholder="เช่น 2567">
                        </div>
                    </div>

                    <!-- ประเภทภาษี & ยอดประเมิน -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ประเภทภาษี <span class="text-rose-500">*</span></label>
                            <select id="taxType" required class="cute-input bg-white">
                                <option value="ภาษีที่ดินและสิ่งปลูกสร้าง">ภาษีที่ดินและสิ่งปลูกสร้าง</option>
                                <option value="ภาษีป้าย">ภาษีป้าย</option>
                                <option value="ค่าขยะ/สิ่งปฏิกูล">ค่าขยะ/สิ่งปฏิกูล</option>
                                <option value="ภาษีและรายได้อื่นๆ">ภาษีและรายได้อื่นๆ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ยอดประเมิน/ค้างชำระ (บาท) <span class="text-rose-500">*</span></label>
                            <input type="number" id="amount" step="0.01" required class="cute-input" placeholder="0.00">
                        </div>
                    </div>

                    <!-- สถานะ Flag สี & ขั้นตอนดำเนินงาน -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ระดับด่วน / Flag สี <span class="text-rose-500">*</span></label>
                            <select id="statusFlag" required class="cute-input bg-white">
                                <option value="black">⚫ ดำ (เร่งด่วนวิกฤต)</option>
                                <option value="red" selected>🔴 แดง (ค้างชำระ)</option>
                                <option value="yellow">🟡 เหลือง (อยู่ระหว่างติดตาม)</option>
                                <option value="green">🟢 เขียว (ชำระเสร็จสิ้น)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ขั้นตอนดำเนินงานปัจจุบัน</label>
                            <input type="text" id="processStep" class="cute-input" placeholder="เช่น ออกหนังสือเตือน ครั้งที่ 1">
                        </div>
                    </div>

                    <!-- เจ้าหน้าที่ผู้รับผิดชอบ -->
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">เจ้าหน้าที่ผู้รับผิดชอบ <span class="text-rose-500">*</span></label>
                        <input type="text" id="officerName" required class="cute-input" placeholder="ระบุชื่อเจ้าหน้าที่ผู้รับผิดชอบ">
                    </div>

                    <!-- เบอร์โทรศัพท์ & ที่อยู่/พิกัด -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                            <input type="text" id="phone" class="cute-input" placeholder="08X-XXX-XXXX">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">ที่อยู่ / พิกัดสถานที่</label>
                            <input type="text" id="address" class="cute-input" placeholder="ที่อยู่ผู้เสียภาษี">
                        </div>
                    </div>

                    <!-- บันทึกหมายเหตุ / ผลการติดตาม -->
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">บันทึกเพิ่มเติม / ผลการลงพื้นที่</label>
                        <textarea id="notes" rows="2" class="cute-input" placeholder="บันทึกรายละเอียดการติดต่อ หรือผลการลงพื้นที่..."></textarea>
                    </div>

                    <!-- ปุ่มบันทึกข้อมูล -->
                    <button type="submit" id="save-btn" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลงระบบ
                    </button>
                </form>
            </div>
        </section>

        <!-- 📑 LIST SECTION: รายการข้อมูลทั้งหมด และปุ่มแก้ไข/ลบ (7 Cols) -->
        <section class="lg:col-span-7 space-y-4">
            <div class="cute-card p-6">
                <div class="flex items-center justify-between border-b-2 border-pink-50 pb-3 mb-4">
                    <h3 class="font-cute font-bold text-lg text-slate-800 flex items-center gap-2">
                        <span>🗂️</span> รายการข้อมูลในระบบทั้งหมด
                    </h3>
                    <span id="total-records-count" class="text-xs bg-pink-100 text-pink-600 px-3 py-1 rounded-full font-bold">0 รายการ</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-pink-50 text-pink-600 font-semibold rounded-xl">
                            <tr>
                                <th class="p-2.5">ระดับ</th>
                                <th class="p-2.5">ผู้เสียภาษี</th>
                                <th class="p-2.5">ยอดเงิน</th>
                                <th class="p-2.5">เจ้าหน้าที่</th>
                                <th class="p-2.5 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="admin-data-table" class="divide-y divide-slate-100">
                            <!-- Dynamic Rows แสดงรายการเคส -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- 📦 SCRIPT CRUD FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ อย่าลืมใส่ค่า Firebase Config ของคุณตรงนี้ครับ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const casesCollection = collection(db, "revenue_cases");

        let allCases = [];

        // Realtime Data Fetching
        const q = query(casesCollection, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allCases = [];
            snapshot.forEach((doc) => {
                allCases.push({ id: doc.id, ...doc.data() });
            });
            renderAdminTable();
        });

        // Render Table
        function renderAdminTable() {
            const tbody = document.getElementById("admin-data-table");
            const countBadge = document.getElementById("total-records-count");
            if (!tbody) return;

            if (countBadge) countBadge.innerText = `${allCases.length} รายการ`;

            if (allCases.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">ยังไม่มีข้อมูลในระบบ</td></tr>`;
                return;
            }

            tbody.innerHTML = allCases.map(item => {
                let badge = "";
                switch(item.statusFlag) {
                    case 'black': badge = '⚫'; break;
                    case 'red': badge = '🔴'; break;
                    case 'yellow': badge = '🟡'; break;
                    case 'green': badge = '🟢'; break;
                }

                return `
                    <tr class="hover:bg-pink-50/20 border-b border-slate-50">
                        <td class="p-2.5 text-base text-center">${badge}</td>
                        <td class="p-2.5">
                            <div class="font-semibold text-slate-800">${item.taxpayerName || '-'}</div>
                            <div class="text-[10px] text-slate-400">${item.taxType} (${item.taxYear})</div>
                        </td>
                        <td class="p-2.5 font-bold text-slate-700">฿${Number(item.amount || 0).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                        <td class="p-2.5 text-slate-500">${item.officerName || '-'}</td>
                        <td class="p-2.5 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick="prepareEdit('${item.id}')" class="p-1.5 text-amber-600 hover:bg-amber-50 rounded-lg" title="แก้ไข">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="deleteCase('${item.id}')" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg" title="ลบ">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Form Submit (Create / Update)
        document.getElementById("case-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-doc-id").value;
            const saveBtn = document.getElementById("save-btn");

            const formData = {
                taxpayerName: document.getElementById("taxpayerName").value.trim(),
                taxId: document.getElementById("taxId").value.trim(),
                taxYear: document.getElementById("taxYear").value.trim(),
                taxType: document.getElementById("taxType").value,
                amount: parseFloat(document.getElementById("amount").value) || 0,
                statusFlag: document.getElementById("statusFlag").value,
                processStep: document.getElementById("processStep").value.trim(),
                officerName: document.getElementById("officerName").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                notes: document.getElementById("notes").value.trim(),
                updatedAt: serverTimestamp()
            };

            try {
                saveBtn.disabled = true;
                saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> กำลังบันทึก...`;

                if (editId) {
                    // Update
                    await updateDoc(doc(db, "revenue_cases", editId), formData);
                    alert("✨ อัปเดตข้อมูลสำเร็จแล้ว!");
                } else {
                    // Create
                    formData.createdAt = serverTimestamp();
                    await addDoc(casesCollection, formData);
                    alert("🎉 บันทึกเคสใหม่เข้าสู่ระบบเรียบร้อยแล้ว!");
                }

                resetForm();
            } catch (error) {
                console.error("Error saving doc: ", error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลงระบบ`;
            }
        });

        // Prepare Edit
        window.prepareEdit = function(id) {
            const item = allCases.find(c => c.id === id);
            if (!item) return;

            document.getElementById("edit-doc-id").value = item.id;
            document.getElementById("taxpayerName").value = item.taxpayerName || '';
            document.getElementById("taxId").value = item.taxId || '';
            document.getElementById("taxYear").value = item.taxYear || '';
            document.getElementById("taxType").value = item.taxType || 'ภาษีที่ดินและสิ่งปลูกสร้าง';
            document.getElementById("amount").value = item.amount || '';
            document.getElementById("statusFlag").value = item.statusFlag || 'red';
            document.getElementById("processStep").value = item.processStep || '';
            document.getElementById("officerName").value = item.officerName || '';
            document.getElementById("phone").value = item.phone || '';
            document.getElementById("address").value = item.address || '';
            document.getElementById("notes").value = item.notes || '';

            document.getElementById("form-title").innerHTML = `<span>✏️</span> แก้ไขข้อมูลเคส`;
            document.getElementById("cancel-edit-btn").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Delete Case
        window.deleteCase = async function(id) {
            if (confirm("⚠️ คุณแน่ใจหรือไม่ที่จะลบรายการนี้ออกจากระบบ?")) {
                try {
                    await deleteDoc(doc(db, "revenue_cases", id));
                    alert("🗑️ ลบข้อมูลเรียบร้อยแล้ว");
                } catch (err) {
                    console.error("Error deleting doc: ", err);
                    alert("เกิดข้อผิดพลาดในการลบข้อมูล");
                }
            }
        };

        // Reset Form
        window.resetForm = function() {
            document.getElementById("case-form").reset();
            document.getElementById("edit-doc-id").value = "";
            document.getElementById("form-title").innerHTML = `<span>✏️</span> บันทึกเคสใหม่`;
            document.getElementById("cancel-edit-btn").classList.add("hidden");
        };
    </script>
</body>
</html>
