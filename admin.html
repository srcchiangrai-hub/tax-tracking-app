<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ระบบบันทึกข้อมูลการลงพื้นที่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { 
      font-family: 'Mitr', sans-serif; 
      background-color: #FFFDF9;
      background-image: radial-gradient(#FFE8D6 0.8px, transparent 0.8px);
      background-size: 16px 16px;
    }
    .pastel-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 2px solid #FFF0E5;
      box-shadow: 0 8px 25px -5px rgba(255, 183, 178, 0.15);
    }
    .pastel-input, .pastel-select {
      background-color: #FFFDFB;
      border: 2px solid #FFE5D9;
      transition: all 0.2s ease;
    }
    .pastel-input:focus, .pastel-select:focus {
      background-color: #FFFFFF;
      border-color: #FFB5A7;
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 181, 167, 0.2);
    }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-700">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="pastel-card p-5 rounded-3xl flex justify-between items-center border-amber-100">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
          🦉
        </div>
        <div>
          <h1 class="text-xl font-bold text-amber-950">บันทึกข้อมูลการลงพื้นที่</h1>
          <p class="text-xs text-amber-700/80">ระบบสำหรับเจ้าหน้าที่จัดการข้อมูลสนาม</p>
        </div>
      </div>
      
      <a href="index.html" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-2.5 rounded-2xl text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
        <span>🐻</span> แดชบอร์ดผู้บริหาร
      </a>
    </div>

    <!-- ฟอร์มบันทึก / แก้ไขข้อมูล -->
    <div class="pastel-card p-6 rounded-3xl border-orange-100">
      <div class="flex items-center justify-between mb-4">
        <h2 id="formTitle" class="text-lg font-bold text-orange-950 flex items-center gap-2">
          <span>📝</span> กรอกข้อมูลการลงพื้นที่สำรวจ
        </h2>
        <span id="editBadge" class="hidden text-xs bg-amber-200 text-amber-900 px-3 py-1 rounded-full font-medium">กำลังอยู่ในโหมดแก้ไข</span>
      </div>

      <form id="surveyForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editKeyId" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่สำรวจ *</label>
            <input type="date" id="docDate" required class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">เจ้าหน้าที่ผู้สำรวจ *</label>
            <input type="text" id="officerName" placeholder="ระบุชื่อเจ้าหน้าที่" required class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผู้เสียภาษี</label>
            <input type="text" id="taxId" placeholder="เช่น TX-1002" class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้เสียภาษี / ร้านค้า *</label>
            <input type="text" id="taxName" placeholder="ระบุชื่อผู้เสียภาษี หรือ ร้านค้า" required class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">สถานที่ / ที่อยู่สำรวจ</label>
            <input type="text" id="address" placeholder="ระบุที่อยู่หรือสถานที่ใกล้เคียง" class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ประเภทภาษี</label>
            <select id="taxType" class="pastel-select w-full p-2.5 rounded-xl text-sm">
              <option value="ภาษีป้าย">ภาษีป้าย</option>
              <option value="ภาษีที่ดินและสิ่งปลูกสร้าง">ภาษีที่ดินและสิ่งปลูกสร้าง</option>
              <option value="ค่าขยะ / ค่าธรรมเนียม">ค่าขยะ / ค่าธรรมเนียม</option>
              <option value="อื่นๆ">อื่นๆ</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ขั้นตอนเอกสาร</label>
            <select id="docType" class="pastel-select w-full p-2.5 rounded-xl text-sm">
              <option value="หนังสือแจ้งเตือน ครั้งที่ 1">หนังสือแจ้งเตือน ครั้งที่ 1</option>
              <option value="หนังสือแจ้งเตือน ครั้งที่ 2">หนังสือแจ้งเตือน ครั้งที่ 2</option>
              <option value="หนังสือแจ้งประเมิน (ภ.ด.ส.6/7)">หนังสือแจ้งประเมิน (ภ.ด.ส.6/7)</option>
              <option value="ลงพื้นที่สำรวจทั่วไป">ลงพื้นที่สำรวจทั่วไป</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ปีที่ค้างชำระ</label>
            <input type="text" id="overdueYears" placeholder="เช่น 2566, 2567" class="pastel-input w-full p-2.5 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ผลการติดตาม *</label>
            <select id="followStatus" required class="pastel-select w-full p-2.5 rounded-xl text-sm">
              <option value="พบผู้ค้างภาษี">🟢 พบผู้ค้างภาษี</option>
              <option value="ไม่พบผู้ค้างภาษี">🔴 ไม่พบผู้ค้างภาษี</option>
              <option value="พบบุคคลอื่น">🟡 พบบุคคลอื่น</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">การรับเอกสาร</label>
            <select id="receiptStatus" class="pastel-select w-full p-2.5 rounded-xl text-sm">
              <option value="ผู้ค้างภาษีรับเอง">ผู้ค้างภาษีรับเอง</option>
              <option value="ญาติ/บริวารรับแทน">ญาติ/บริวารรับแทน</option>
              <option value="ปฏิเสธการรับ">ปฏิเสธการรับ</option>
              <option value="ปิดหนังสือไว้ ณ ภูมิลำเนา">ปิดหนังสือไว้ ณ ภูมิลำเนา</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุเพิ่มเติม</label>
            <textarea id="note" rows="2" placeholder="รายละเอียดเพิ่มเติม..." class="pastel-input w-full p-2.5 rounded-xl text-sm"></textarea>
          </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" id="submitBtn" class="bg-orange-400 hover:bg-orange-500 text-white px-6 py-3 rounded-2xl text-sm font-semibold transition shadow-md flex-1">
            ➕ บันทึกข้อมูล
          </button>
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-2xl text-sm font-semibold transition">
            ❌ ยกเลิกแก้ไข
          </button>
        </div>
      </form>
    </div>

    <!-- ประวัติการบันทึก -->
    <div class="pastel-card p-6 rounded-3xl border-amber-100">
      <h2 class="text-lg font-bold text-amber-950 mb-4 flex items-center gap-2">
        <span>📋</span> รายการที่เคยบันทึกไว้ในระบบ
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-2 border-amber-100 text-xs font-semibold text-slate-500">
              <th class="p-3">วันที่</th>
              <th class="p-3">เจ้าหน้าที่</th>
              <th class="p-3">ผู้เสียภาษี / ร้านค้า</th>
              <th class="p-3">ผลการติดตาม</th>
              <th class="p-3 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-amber-50 text-sm">
            <tr><td colspan="5" class="text-center py-6 text-slate-400">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    initAdmin();
  </script>
</body>
</html>
