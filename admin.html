<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ ระบบบันทึกข้อมูลการออกติดตามภาษี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive, sans-serif; }
  </style>
</head>
<body class="bg-pink-50/60 text-slate-700 p-4 md:p-8 min-h-screen flex items-center justify-center">

  <!-- 1. หน้าล็อกอิน -->
  <div id="loginSection" class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border-4 border-pink-200 p-8 space-y-6">
    <div class="text-center space-y-2">
      <span class="bg-pink-100 text-pink-600 px-4 py-1.5 rounded-full text-xs font-bold shadow-sm">🔒 Staff Only</span>
      <h2 class="text-2xl font-bold text-pink-600 mt-2">เข้าสู่ระบบเจ้าหน้าที่</h2>
      <p class="text-slate-400 text-xs">ระบบบันทึกข้อมูลการออกติดตามภาษี</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-1">อีเมลผู้ใช้งาน</label>
        <input type="email" id="loginEmail" required placeholder="staff@example.com" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-pink-400">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-1">รหัสผ่าน</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-pink-400">
      </div>
      <button type="submit" id="btnLogin" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:opacity-90 transition text-sm">
        🔑 เข้าสู่ระบบ
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-purple-600 hover:underline font-bold">👑 ไปยังหน้าผู้บริหาร (Dashboard)</a>
    </div>
  </div>

  <!-- 2. หน้าฟอร์มบันทึกข้อมูล -->
  <div id="adminSection" class="hidden w-full max-w-2xl mx-auto space-y-6">
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border-4 border-pink-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="bg-pink-100 text-pink-600 px-4 py-1.5 rounded-full text-xs font-bold shadow-sm">📝 Staff Portal</span>
        <h1 class="text-2xl font-bold text-pink-600 mt-2">บันทึกการออกติดตามภาษี</h1>
        <p class="text-xs text-slate-400" id="userStatusText">ผู้ใช้งาน: -</p>
      </div>
      <div class="flex gap-2">
        <a href="index.html" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-2xl text-xs font-bold transition shadow-md flex items-center">👑 หน้าผู้บริหาร</a>
        <button id="btnLogout" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-2xl text-xs font-bold transition shadow-md">🚪 ออกจากระบบ</button>
      </div>
    </div>

    <form id="taxForm" class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border-4 border-pink-200 p-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ชื่อ-นามสกุล ผู้เสียภาษี *</label>
          <input type="text" id="fullName" required placeholder="นายสมชาย ใจดี" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">รหัสผู้เสียภาษี / เลขประจำตัว</label>
          <input type="text" id="taxId" placeholder="1234567890123" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ประเภทภาษี *</label>
          <select id="taxType" required class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
            <option value="ภาษีที่ดินและสิ่งปลูกสร้าง">ภาษีที่ดินและสิ่งปลูกสร้าง</option>
            <option value="ภาษีป้าย">ภาษีป้าย</option>
            <option value="ค่าขยะ/ค่าธรรมเนียม">ค่าขยะ/ค่าธรรมเนียม</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ยอดเงินค้างชำระ (บาท) *</label>
          <input type="number" id="taxAmount" required placeholder="0" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
      </div>

      <div class="border-t border-pink-100 pt-3">
        <label class="block text-sm font-bold text-slate-700 mb-2">ที่อยู่ผู้ค้างชำระ</label>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
          <input type="text" id="houseNo" placeholder="บ้านเลขที่" class="bg-pink-50/50 border border-pink-200 rounded-xl p-2">
          <input type="text" id="soi" placeholder="ตรอก/ซอย" class="bg-pink-50/50 border border-pink-200 rounded-xl p-2">
          <input type="text" id="road" placeholder="ถนน/ตำบล" class="bg-pink-50/50 border border-pink-200 rounded-xl p-2">
          <input type="text" id="district" placeholder="อำเภอ" class="bg-pink-50/50 border border-pink-200 rounded-xl p-2">
          <input type="text" id="province" placeholder="จังหวัด" class="bg-pink-50/50 border border-pink-200 rounded-xl p-2">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-pink-100 pt-3">
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ผลการติดตาม *</label>
          <select id="followResult" required class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
            <option value="พบผู้ค้างภาษี">พบผู้ค้างภาษี</option>
            <option value="ไม่พบผู้ค้างภาษี">ไม่พบผู้ค้างภาษี</option>
            <option value="ย้ายที่อยู่">ย้ายที่อยู่</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ประเภทหนังสือที่นำส่ง</label>
          <input type="text" id="docType" placeholder="เช่น หนังสือแจ้งเตือนครั้งที่ 1" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-600 mb-1">รายละเอียดเพิ่มเติม</label>
        <textarea id="otherDetail" rows="2" placeholder="ระบุข้อมูลเพิ่มเติมถ้ามี..." class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400"></textarea>
      </div>

      <div class="border-t border-pink-100 pt-3">
        <label class="block text-sm font-bold text-slate-600 mb-1">📸 ภาพถ่ายสถานที่ / การลงพื้นที่</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-pink-100 pt-3">
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ชื่อเจ้าหน้าที่ลงพื้นที่ *</label>
          <input type="text" id="reporterName" required placeholder="นายตรวจการ ดีมาก" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-600 mb-1">ตำแหน่งเจ้าหน้าที่</label>
          <input type="text" id="reporterPosition" placeholder="นักวิชาการจัดเก็บรายได้" class="w-full bg-pink-50/50 border-2 border-pink-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-pink-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-600 mb-1">พิกัดสถานที่ (GPS)</label>
        <div class="flex gap-2">
          <input type="text" id="location" readonly placeholder="กดปุ่มเพื่อดึงพิกัด" class="w-full bg-slate-100 border-2 border-pink-200 rounded-2xl p-2.5 text-sm">
          <button type="button" id="btnGetLocation" class="bg-pink-500 hover:bg-pink-600 text-white px-4 rounded-2xl text-xs font-bold transition whitespace-nowrap">📍 ดึงพิกัด</button>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:opacity-90 transition text-base">
        💾 บันทึกข้อมูลเข้าระบบ
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 🔴 ใส่ Firebase Config จริงของคุณที่นี่
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        adminSection.classList.remove("hidden");
        document.getElementById("userStatusText").innerText = `ผู้ใช้งาน: ${user.email}`;
      } else {
        loginSection.classList.remove("hidden");
        adminSection.classList.add("hidden");
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPassword").value;
      const btnLogin = document.getElementById("btnLogin");

      try {
        btnLogin.disabled = true;
        btnLogin.innerText = "⏳ กำลังเข้าสู่ระบบ...";
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("❌ เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง");
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerText = "🔑 เข้าสู่ระบบ";
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      if (confirm("ต้องการออกจากระบบใช่หรือไม่?")) signOut(auth);
    });

    document.getElementById("btnGetLocation").addEventListener("click", () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { document.getElementById("location").value = `${pos.coords.latitude}, ${pos.coords.longitude}`; },
          (err) => alert("ไม่สามารถดึงพิกัด GPS ได้: " + err.message)
        );
      } else {
        alert("อุปกรณ์นี้ไม่รองรับ Geolocation");
      }
    });

    document.getElementById("taxForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;
      btnSubmit.innerText = "⏳ กำลังบันทึกข้อมูล...";

      try {
        let photoUrl = "";
        const photoFile = document.getElementById("photoInput").files[0];

        if (photoFile) {
          const storageRef = ref(storage, `photos/${Date.now()}_${photoFile.name}`);
          const uploadResult = await uploadBytes(storageRef, photoFile);
          photoUrl = await getDownloadURL(uploadResult.ref);
        }

        const payload = {
          fullName: document.getElementById("fullName").value,
          taxId: document.getElementById("taxId").value,
          taxType: document.getElementById("taxType").value,
          taxAmount: Number(document.getElementById("taxAmount").value) || 0,
          address: {
            houseNo: document.getElementById("houseNo").value,
            soi: document.getElementById("soi").value,
            road: document.getElementById("road").value,
            district: document.getElementById("district").value,
            province: document.getElementById("province").value
          },
          followResult: document.getElementById("followResult").value,
          docType: document.getElementById("docType").value,
          otherDetail: document.getElementById("otherDetail").value,
          photoUrl: photoUrl,
          reporterName: document.getElementById("reporterName").value,
          reporterPosition: document.getElementById("reporterPosition").value,
          location: document.getElementById("location").value,
          createdAt: serverTimestamp()
        };

        await addDoc(collection(db, "tax_records"), payload);
        alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("taxForm").reset();
      } catch (err) {
        alert("❌ เกิดข้อผิดพลาดในการบันทึก: " + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "💾 บันทึกข้อมูลเข้าระบบ";
      }
    });
  </script>
</body>
</html>
